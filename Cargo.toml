[package]
name = "rinha"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "./src/main.rs"

[[bin]]
name = "build_bin"
path = "./src/build_bin.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.2", features = ["full"] }
time = { version = "0.3", features = [ "serde", "serde-well-known", "formatting", "parsing", "macros"] }
config = "0.15.22"


[dev-dependencies]
reqwest = "0.13.3"


