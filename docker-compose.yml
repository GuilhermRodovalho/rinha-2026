services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"

  api1:
    image: ghcr.io/guilhermrodovalho/rinha-2026:latest
    platform: linux/amd64
    environment:
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' 2>/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    image: ghcr.io/guilhermrodovalho/rinha-2026:latest
    platform: linux/amd64
    environment:
      PORT: "3000"
    depends_on:
      api1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' 2>/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"
