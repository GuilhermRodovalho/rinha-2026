services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"

  api1:
    build: .
    image: rinha-api
    platform: linux/amd64
    environment:
      PORT: "3000"
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api2:
    build: .
    image: rinha-api
    platform: linux/amd64
    environment:
      PORT: "3000"
    depends_on:
      - api1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"
